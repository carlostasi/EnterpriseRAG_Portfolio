# Avvio: docker compose up -d --build
# Ricrea sempre gli stessi container (rag-api, rag-frontend) invece di crearne di nuovi
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: automotive-rag-api
    container_name: rag-api
    env_file: .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: automotive-rag-frontend
    container_name: rag-frontend
    env_file: .env
    environment:
      # Dentro la rete di compose il backend si raggiunge col nome del servizio, non con localhost
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
